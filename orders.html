<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #065e65, #421f5a);
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
      color: black;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #2e8b57;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Orders</h1>
    <table>
      <tr>
        <th>Order ID</th>
        <th>Item</th>
        <th>Buyer</th>
        <th>Status</th>
      </tr>
      <tr>
        <td>ORD123</td>
        <td>Wheat Straw</td>
        <td>GreenFuel Ltd</td>
        <td>Shipped</td>
      </tr>
      <tr>
        <td>ORD124</td>
        <td>Rice Husk</td>
        <td>AgroBioTech</td>
        <td>Pending</td>
      </tr>
    </table>
  </div>
</body>
</html>

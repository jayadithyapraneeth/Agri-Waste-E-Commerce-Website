<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seller Registration</title>
  <style>
    body {
      background: linear-gradient(to right, #065e65, #421f5a);
      font-family: Arial, sans-serif;
      color: white;
      padding: 30px;
    }
    .form-container {
      max-width: 500px;
      margin: auto;
      background: white;
      color: black;
      padding: 30px;
      border-radius: 10px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
      font-size: 1em;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Seller Registration</h2>
    <form action="newsellerregistrationservlet" method="post">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required />

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required />

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" />

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phoneno" name="phoneno" pattern="[0-9]{10}" title="Enter a 10-digit phone number" required />

      <label for="location">Location:</label>
      <textarea id="location" name="location" rows="3" required></textarea>

      <!-- Hidden input field for custom waste -->
      <div id="otherDiv" style="display: none; margin-top: 10px;">
        <input type="text" id="otherWaste" name="otherwastetype" placeholder="Enter your waste type">
      </div>

      <button type="submit">Register</button>
    </form>
  </div>
</body>
</html>

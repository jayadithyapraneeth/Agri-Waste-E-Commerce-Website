<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot User ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .forgot-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 25px;
        }
        
        .logo h1 {
            color: #667eea;
            font-size: 28px;
        }
        
        .forgot-container h2 {
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .back-link {
            margin-top: 25px;
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .forgot-container {
                padding: 30px 20px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="logo">
            <h1>Agri-Waste Trading</h1>
        </div>
        
        <h2>Forgot User ID</h2>
        
        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your registered email address" required>
            </div>
            
            <div class="input-group">
                <label for="password">Account Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your account password" required>
            </div>
            <div class="role" role="radiogroup" aria-label="Choose your role">
         		<label class="role-pill selected">Farmer --> <input id="role" type="radio" name="role" value="seller"></label><br>
       		 	<label class="role-pill">Buyer --><input id="role" type="radio" name="role" value="buyer"></label>
      		</div>
            
            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing request...</p>
        </div>
        
        <div class="message success" id="successMessage">
            User ID found and the user ID is sent to your registered email address
        </div>
        
        <div class="message error" id="errorMessage">
            User ID not found, check the password, email and try again
        </div>
        
        <a href="loginpage.html" class="back-link">← Back to Login</a>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loading indicator
            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.querySelector('.submit-btn');
            
            loading.style.display = 'block';//on submit and until server response received
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            
            // Get form values
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            // In a real application, you would make an AJAX request to your server here
            // For demonstration purposes, we'll simulate the response
            setTimeout(function() {
                // Simulate different responses based on input
                    // This is where you'd make actual HTTP request using fetch or XMLHttpRequest
                    // Example with fetch:
                    
                    	
                    	
                    fetch('forgotservlet?purpose=forgotuserid&from=forgotuserid&role='+role, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            emailid: email,
                            password: password
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if(data.status === "useridfound"){
                        	const serverresponse = {
                        		status : 'userid_found',
                        		message : 'User ID found and sent to email'
                        	}
                        	handleServerResponse(serverresponse);	
                        }else if(data.status === "useridnotfound"){
                        	const serverresponse = {
                            		status : 'userid_not_found',
                            		message : 'Invalid input or user not found'
                            	}
                            	handleServerResponse(serverresponse);
                        } 
                    });
                    
                    // Simulating a successful response for demonstration purposes
                    /* const mockResponse = {
                        status: 'userid_found',
                        message: 'User ID found and sent to email'
                    }; */
                
                // Hide loading after a delay
                setTimeout(function() {
                    loading.style.display = 'none';
                    submitBtn.disabled = false;
                }, 1000);
            }, 2000); // Simulate network delay
        });
        
        function handleServerResponse(response) {
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            if(response.status === 'userid_found') {
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                
                // Add animation effect
                successMessage.style.animation = 'fadeIn 0.5s';
                
                // Clear form fields after successful submission
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            } else if(response.status === 'userid_not_found') {
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                
                // Add animation effect
                errorMessage.style.animation = 'fadeIn 0.5s';
            }
        }
        
        // Add some basic styling for the message fade-in effect
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

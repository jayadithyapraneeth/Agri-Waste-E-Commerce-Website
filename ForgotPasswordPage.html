<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
        }
        
        h2 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address" required>
            </div>
            
            <div class="form-group">
                <label for="userId">User ID:</label>
                <input type="text" id="userid" name="userid" required placeholder="Enter your user ID" required>
            </div>
            <div class="form-group" role="radiogroup" aria-label="Choose your role">
         		<label class="role-pill selected">Farmer --> <input id="role" type="radio" name="role" value="seller"></label><br>
       		 	<label class="role-pill">Buyer --><input id="role" type="radio" name="role" value="buyer"></label>
      		</div>
            
            <button type="submit">Submit</button>
        </form>
        
        <div class="loading" id="loading"></div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const userid = document.getElementById('userid').value;
            const messageDiv = document.getElementById('message');
            const loadingElement = document.getElementById('loading');
            const role = document.getElementById('role').value;
            
            // Show loading
            loadingElement.style.display = 'block';
            messageDiv.style.display = 'none';
            
            try {
                // Simulate API call - replace with your actual endpoint
                const response = await fetch('forgotservlet?purpose=forgotpassword&from=forgotpassword&role='+role, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        emailid: email,
                        userid: userid
                    })
                });
                
                const data = await response.json();
                
                // Hide loading
                loadingElement.style.display = 'none';
                
                if(data.status === 'emailmatched') {
                    showMessage('Email ID is matched corresponding to the userID specified', 'success');
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'PasswordResetPage.html?userid='+userid+'&role='+role; // Replace with your actual URL
                    }, 3000);
                } else if(data.status === 'emailnotmatched') {
                    showMessage('Email ID not matched to the corresponding userID, check the email ID and try again', 'error');
                } else {
                    showMessage('An unexpected error occurred. Please try again.', 'error');
                }
            } catch (error) {
                // Hide loading
                loadingElement.style.display = 'none';
                showMessage('Network error. Please try again later.', 'error');
                console.error('Error:', error);
            }
        });
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Auto-hide success messages after 5 seconds
            if(type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>

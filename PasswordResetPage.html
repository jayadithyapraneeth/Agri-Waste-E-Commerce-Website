<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .reset-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
        }
        
        .reset-header {
            margin-bottom: 30px;
        }
        
        .reset-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .user-id-display {
            background-color: #e9f7fe;
            border: 1px solid #b3e0ff;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-weight: bold;
            color: #2c5aa0;
            font-size: 18px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="password"]:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .submit-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            margin: 20px auto;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .password-strength {
            height: 4px;
            background-color: #eee;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .strength-meter {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h2>Reset Password</h2>
            <p>Please enter your new password below</p>
        </div>
        
        <div class="user-id-display">
            User ID: <span id="currentUserId"></span>
        </div>
        
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" required>
                <div class="password-strength">
                    <div id="strengthMeter" class="strength-meter"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Reset Password</button>
        </form>
        
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Processing your request...</p>
        </div>
        
        <div class="message success" id="successMessage">
            Password reset successfully! Redirecting to login page...
        </div>
        
        <div class="message error" id="errorMessage">
            Failed to reset password. Please try again.
        </div>
        
        <a href="loginpage.html" class="back-link">Back to Login Page</a>
    </div>

    <script>
        // Get current user ID from session or stored data
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const userIdElement = document.getElementById('currentUserId');
            userIdElement.innerText = urlParams.get('userid');
            
            // In a real application, you would get the user ID from server-side session
            // For demonstration purposes, we'll use a placeholder
            
            
            const form = document.getElementById('resetPasswordForm');
            const submitBtn = document.getElementById('submitBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // Password strength meter
            const newPasswordInput = document.getElementById('newPassword');
            const strengthMeter = document.getElementById('strengthMeter');
            
            newPasswordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;
                
                if(password.length >= 8) strength += 1;
                if(/[A-Z]/.test(password)) strength += 1;
                if(/[a-z]/.test(password)) strength += 1;
                if(/\d/.test(password)) strength += 1;
                if(/[^A-Za-z\d]/.test(password)) strength += 1;
                
                const percentage = Math.min(100, strength * 20);
                strengthMeter.style.width = `${percentage}%`;
                
                // Color based on strength
                if(strength < 3) {
                    strengthMeter.style.backgroundColor = '#dc3545'; // Red for weak
                } else if(strength < 5) {
                    strengthMeter.style.backgroundColor = '#ffc107'; // Yellow for medium
                } else {
                    strengthMeter.style.backgroundColor = '#28a745'; // Green for strong
                }
            });
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Validate passwords match
                if(newPassword !== confirmPassword) {
                    showMessage('Passwords do not match!', 'error');
                    return;
                }
                
                // Validate password length
                if(newPassword.length < 8) {
                    showMessage('Password must be at least 8 characters long', 'error');
                    return;
                }
                
                // Show loading state
                showLoading();
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch('forgotemailservlet?purpose=passwordresetconfirmation', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            userId: urlParams.get('userid'),
                            newPassword: newPassword,
                            role: urlParams.get('role')
                        })
                    });
                    
                    const result = await response.json();
                    
                    if(response.ok) {
                    	if(result.status === 'passwordresetsuccessful'){
                    		showMessage('Password reset successfully!', 'success');
                    	}else if(result.status === 'passwordresetfailed'){
                    		showMessage('Password reset failed. Please try again.', 'error');
                    	}
                    	
                        // Redirect to login page after delay
                        setTimeout(() => {
                            window.location.href = 'loginpage.html';
                        }, 2000);
                    } else {
                        showMessage(result.message || 'Failed to reset password', 'error');
                    }
                } catch (error) {
                    console.error('Error resetting password:', error);
                    showMessage('Network error occurred. Please try again later.', 'error');
                } finally {
                    hideLoading();
                    submitBtn.disabled = false;
                }
            });
        });
        
        function showMessage(message, type) {
            // Hide all messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            if(type === 'success') {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
            } else {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
        }
        
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    </script>
</body>
</html>
